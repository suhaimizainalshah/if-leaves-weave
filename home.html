<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* one-time move of settings and saved signatures stored under the old name (Folio) */try{for(let i=localStorage.length;i--;){const k=localStorage.key(i);if(k&&/^folio/.test(k)){const n=k.replace(/^folio/,"ifleavesweave");if(localStorage.getItem(n)===null)localStorage.setItem(n,localStorage.getItem(k));localStorage.removeItem(k)}}}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>If Leaves Weave: free, private tools for documents, plans and people</title>
<meta name="description" content="Seventeen free tools that run in your browser: a PDF editor, boards, a whiteboard, mind and concept maps, sociograms, genograms, ecomaps, maths, citations, study cards, a question bank, marking, rubrics, seating plans, chronologies and app prototypes. Nothing is uploaded.">
<link rel="icon" href="logo.png" type="image/png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="studio/studio.css">
<style>
body{overflow:auto}.hub{max-width:1100px;margin:0 auto;padding:clamp(1rem,4vw,2.6rem)}
.hub-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.6rem}.hub-top .brand{padding:0}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem}@media (max-width:760px){.tools{grid-template-columns:1fr}}
.tool{display:grid;grid-template-columns:auto 1fr;gap:.25rem .9rem;align-items:start;padding:1.1rem;border:1px solid var(--line);border-radius:var(--r3);background:var(--panel);text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s}
.tool:hover,.tool:focus-visible{border-color:var(--accent);box-shadow:var(--shadow)}.tool svg{width:30px;height:30px;color:var(--accent);grid-row:span 2}
.tool b{font-size:1.02rem}.tool small{color:var(--muted);font-size:.88rem;line-height:1.45}.tools>.tool:not(.lead):last-child:nth-child(3n+2){grid-column:1/-1}.tool.lead{grid-column:1/-1;background:linear-gradient(120deg,var(--panel),var(--accent-soft))}
.recentw button,.recentw a{display:flex;gap:.6rem;align-items:center;padding:.7rem .8rem;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);text-align:left;text-decoration:none;color:inherit}
.recentw svg{width:20px;height:20px;color:var(--muted);flex-shrink:0}.recentw small{display:block;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<main class="hub">
  <div class="hub-top"><a class="brand" href="home.html" aria-label="If Leaves Weave home"><img src="logo.png" alt="" width="26" height="26"><span>If Leaves Weave</span></a><button class="ghost" id="themeBtn">Theme</button></div>
  <section class="hero"><svg class="contours" viewBox="0 0 520 420" aria-hidden="true" id="contours"></svg>
    <h1>Separate pages, woven into one.</h1>
    <p>Seventeen free tools for documents, plans, learning and people. They run in your browser, work offline and keep everything on this device: no accounts, no uploads, no tracking.</p></section>
  <section class="section"><h2>Choose a tool</h2><div class="tools" id="tools"></div></section>
  <section class="section"><h2>Guides</h2><div class="tools" id="guides"></div></section>
  <section class="section" id="recentSec" hidden><h2>Your recent work</h2><div class="recent recentw" id="recent"></div></section>
  <p class="privacy" id="privacy"></p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="studio/js/core.js"></script>
<script>
(async () => {
  try { const th = localStorage.getItem("ifleavesweave-theme"); if (th) document.documentElement.dataset.theme = th; } catch {}
  $("#themeBtn").onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"), nx = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = nx; try { localStorage.setItem("ifleavesweave-theme", nx); } catch {} };
  const pdfIcon = IC('<path d="M7 3h8l5 5v13H7z"/><path d="M15 3v5h5"/><path d="M10 14h7M10 17h5"/>');
  const tools = [["index.html", "If Leaves Weave PDF", "Edit, sign, fill, convert, compare and redact PDFs.", pdfIcon, true], ...Object.values(TYPES).map(t => [t.page, t.family, t.blurb + ".", ICONS[t.icon]])];
  $("#tools").innerHTML = tools.map(([href, n, d, ic, lead]) => `<a class="tool${lead ? " lead" : ""}" href="${href}">${ic}<b>${esc(n)}</b><small>${esc(d)}</small></a>`).join("");
$("#guides").innerHTML = `<a class="tool lead" href="practitioners.html">${ICONS.ecomap || ""}<b>For youth and case workers</b><small>How the Ecomap, Genogram, Sociogram and Chronology fit together in an assessment, with the research behind each.</small></a>`;
  $("#privacy").innerHTML = ICONS.lock + "<span>Your work is saved in this browser only. In each tool, Back up saves everything from Boards, Canvas, Wall, Maps, Sociogram, Genogram and Prototype to one file. Ecomap, Study cards, Rubric, Seating and Chronology each save their own file.</span>";
  let s = ""; for (let i = 0; i < 9; i++) { const r = 40 + i * 26; s += `<ellipse cx="300" cy="200" rx="${r * 1.25}" ry="${r * .85}" fill="none" stroke="${i === 4 ? "var(--mari)" : "var(--accent)"}" stroke-opacity="${i === 4 ? .9 : .25}" stroke-width="${i === 4 ? 2 : 1.3}" transform="rotate(${i * 4 - 12} 300 200)"/>`; } $("#contours").innerHTML = s;
  const docs = (await Store.all()).sort((a, b) => b.updated - a.updated).slice(0, 8);
  if (docs.length) { $("#recentSec").hidden = false; $("#recent").innerHTML = docs.filter(d => TYPES[d.type]).map(d => `<a href="${TYPES[d.type].page}#${d.id}">${ICONS[TYPES[d.type].icon]}<span><b>${esc(d.title)}</b><small>${TYPES[d.type].family.replace("If Leaves Weave ", "")}, ${new Date(d.updated).toLocaleDateString(undefined, { day: "numeric", month: "short" })}</small></span></a>`).join(""); }
  try { if (!sessionStorage.getItem("ifleavesweave-visit-home")) { sessionStorage.setItem("ifleavesweave-visit-home", "1"); count("home_visits"); } } catch {}
})();
</script>
</body>
</html>
