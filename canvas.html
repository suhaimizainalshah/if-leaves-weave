<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>/* one-time move of settings and saved signatures stored under the old name (Folio) */try{for(let i=localStorage.length;i--;){const k=localStorage.key(i);if(k&&/^folio/.test(k)){const n=k.replace(/^folio/,"ifleavesweave");if(localStorage.getItem(n)===null)localStorage.setItem(n,localStorage.getItem(k));localStorage.removeItem(k)}}}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>If Leaves Weave Canvas</title>
<meta name="description" content="An endless whiteboard with sticky notes, shapes, connectors, frames and a pen. Free, private and offline.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232453D6'/><path d='M7 25C7 14 14 7 25 7c0 11-7 18-18 18z' fill='white'/><path d='M9.5 22.5 22.5 9.5' stroke='%232453D6' stroke-width='1.8' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="studio/studio.css">
</head>
<body>
<div class="app" id="app">
  <aside class="rail" aria-label="Your documents">
    <button class="brand" id="homeBtn" aria-label="If Leaves Weave Canvas home"><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 27C5 14 13 6 27 5c0 14-8 22-22 22z" fill="var(--blue)"/><path d="M8 24 24 8" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M11 15c3 1.5 5.5 4.5 7 9M16 10.5c2.5 2 4 5 4.3 9" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".85"/></svg><span>If Leaves Weave<small id="brandName"></small></span></button>
    <button class="fam" id="famBtn" aria-haspopup="true">All If Leaves Weave tools <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="btn primary new" id="newBtn"><span aria-hidden="true">＋</span> New</button>
    <label class="search"><span class="sr" hidden>Search documents</span><span id="searchIc"></span><input type="search" id="search" placeholder="Search" aria-label="Search documents"></label>
    <nav class="doclist" id="doclist"></nav>
    <footer>
      <button class="ghost" id="exportAll" title="Save everything to a file">Back up</button>
      <button class="ghost" id="importBtn" title="Open a backup or a shared document">Open file</button>
      <button class="ghost" id="themeBtn" title="Switch light or dark">Theme</button>
    </footer>
  </aside>
  <section class="main">
    <header class="topbar" id="topbar"></header>
    <div class="body no-insp" id="body"><div class="home" id="home"></div></div>
  </section>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>window.IFLEAVES_TOOL = "whiteboard";</script>
<script src="studio/js/core.js"></script>
<script src="studio/js/sna.js"></script>
<script src="studio/js/board.js"></script>
<script src="studio/js/whiteboard.js"></script>
<script src="studio/js/mindmap.js"></script>
<script src="studio/js/sociogram.js"></script>
<script src="studio/js/genogram.js"></script>
<script src="studio/js/prototype.js"></script>
<script src="studio/js/app.js"></script>
</body>
</html>
